<svg id="svg-citadel-shield" width="132" height="150" viewBox="0 0 140 160" fill="none" xmlns="http://www.w3.org/2000/svg">
                <defs>
                  <linearGradient id="aptGoldBevel" x1="20" y1="16" x2="120" y2="148" gradientUnits="userSpaceOnUse">
                    <stop offset="0%" stop-color="#F7DD74"/>
                    <stop offset="50%" stop-color="#F7BE4F"/>
                    <stop offset="100%" stop-color="#D99D36"/>
                  </linearGradient>
                  <linearGradient id="aptCitadelWall" x1="70" y1="46" x2="70" y2="104" gradientUnits="userSpaceOnUse">
                    <stop offset="0%" stop-color="#FDFDFB"/>
                    <stop offset="100%" stop-color="#A1FCFD"/>
                  </linearGradient>
                  <radialGradient id="aptPortalGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(70 92) rotate(90) scale(16 12)">
